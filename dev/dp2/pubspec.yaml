name: dp2
description: "A Daily Planner App"
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.5.3

dependencies:
  flutter:
    sdk: flutter
  english_words: ^4.0.0
  provider: ^6.0.0
  firebase_core: ^3.6.0
  cloud_firestore: ^5.4.3
  firebase_auth: ^5.3.1 
  go_router: ^6.0.0     
  flutter_localizations:
    sdk: flutter
  intl: any


  

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  generate: true
  # Add ARB files for localization
  assets:
    - lib/l10n/app_en.arb
    - lib/l10n/app_sv.arb
